<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Jogos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Gerenciador de Jogos de Videogame</h1>

        <p id="mensagem"></p>

        <!-- Lista de jogos -->
        <section id="lista">

            <div id="jogos"></div>

            <button onclick="mostrarFormulario()">
                Incluir novo jogo
            </button>

        </section>

        <!-- Formulário de cadastro e alteração -->
        <section id="formulario" class="escondido">

            <h2 id="tituloFormulario">Incluir novo jogo</h2>

            <form id="formJogo">

                <label>Título</label>
                <input type="text" id="titulo">

                <label>Ano de lançamento</label>
                <input type="number" id="ano">

                <label>Plataforma</label>
                <input type="text" id="plataforma">

                <label>Disponível</label>

                <div>
                    <label>
                        <input type="radio" name="disponivel"
                            value="true" checked>
                        Sim
                    </label>

                    <label>
                        <input type="radio" name="disponivel"
                            value="false">
                        Não
                    </label>
                </div>

                <label>Observações</label>
                <textarea id="observacoes"></textarea>

                <button type="submit">Salvar</button>

                <button type="button" onclick="voltarLista()">
                    Voltar
                </button>

            </form>

        </section>

    </main>

    <!-- Identificação do projeto -->
    <footer>
        <p>Laura de Melo Damasceno | Melissa Martins Libanio</p>
        <p>TADS - DSW - 2026</p>
        <p>Usou IA: SIM. Apoio na estruturação e explicação do código.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
